swagger: '2.0'
info:
  description: 'Asura Social API docs'
  version: '2.0.0'
  title: 'Asura Social Network API Manage'
  termsOfService: 'http://asura.com.vn'
  contact:
    email: 'luannguyentm99@gmail.com'
  license:
    name: 'MIT'
    url: 'https://opensource.org/licenses/MIT'
basePath: '/api'
tags:
- name: 'auth'
  description: 'Authentication APIs'
- name: 'refresh_token'
  description: 'Get new token and revoke token'
- name: 'users'
  description: 'User Management APIs'
- name: 'profile'
  description: 'Profile Management APIs'
- name: 'posts'
  description: 'Post APIs'
- name: 'groups'
  description: 'Group APIs'
- name: 'conversations'
  description: 'Message APIs'
schemes:
- 'http'
securityDefinitions:
  ApiKeyAuth:
    type: apiKey
    in: header
    name: x-auth-token
paths:
  /auth:
    post:
      tags:
      - 'auth'
      summary: 'Login API and get token'
      description: 'Input email and password to authenticate user'
      operationId: "login"
      consumes:
      - 'application/json'
      produces:
      - 'application/json'
      parameters:
      - in: 'body'
        name: 'body'
        description: 'Login credentials for user'
        required: true
        schema: 
          $ref: '#/definitions/LoginDto'
      responses:
        '200':
          description: 'Login successful'
          schema:
            $ref: '#/definitions/AuthResponse'
        '400':
          description: 'Invalid input'
        '401':
          description: 'Invalid credentials'
    get:
      tags:
      - 'auth'
      summary: 'Get current logged in user'
      description: 'Get current user information using token'
      operationId: "getCurrentUser"
      produces:
      - 'application/json'
      security:
      - ApiKeyAuth: []
      responses:
        '200':
          description: 'User information retrieved successfully'
          schema:
            $ref: '#/definitions/User'
        '401':
          description: 'Unauthorized - Invalid token'

  /users:
    post:
      tags:
      - 'users'
      summary: 'Register new user'
      description: 'Create a new user account'
      operationId: "registerUser"
      consumes:
      - 'application/json'
      produces:
      - 'application/json'
      parameters:
      - in: 'body'
        name: 'body'
        description: 'User registration data'
        required: true
        schema: 
          $ref: '#/definitions/RegisterDto'
      responses:
        '201':
          description: 'User created successfully'
          schema:
            $ref: '#/definitions/User'
        '400':
          description: 'Invalid input or user already exists'
    get:
      tags:
      - 'users'
      summary: 'Get all users'
      description: 'Retrieve all users in the system'
      operationId: "getAllUsers"
      produces:
      - 'application/json'
      responses:
        '200':
          description: 'Users retrieved successfully'
          schema:
            type: array
            items:
              $ref: '#/definitions/User'

  /users/{userId}:
    get:
      tags:
      - 'users'
      summary: 'Get user by ID'
      description: 'Retrieve a specific user by their ID'
      operationId: "getUserById"
      produces:
      - 'application/json'
      parameters:
      - name: 'userId'
        in: 'path'
        description: 'ID of user to retrieve'
        required: true
        type: 'string'
      responses:
        '200':
          description: 'User retrieved successfully'
          schema:
            $ref: '#/definitions/User'
        '404':
          description: 'User not found'
    put:
      tags:
      - 'users'
      summary: 'Update user'
      description: 'Update user information'
      operationId: "updateUser"
      consumes:
      - 'application/json'
      produces:
      - 'application/json'
      parameters:
      - name: 'userId'
        in: 'path'
        description: 'ID of user to update'
        required: true
        type: 'string'
      - in: 'body'
        name: 'body'
        description: 'User data to update'
        required: true
        schema: 
          $ref: '#/definitions/UpdateUserDto'
      responses:
        '200':
          description: 'User updated successfully'
          schema:
            $ref: '#/definitions/User'
        '400':
          description: 'Invalid input'
        '404':
          description: 'User not found'
    delete:
      tags:
      - 'users'
      summary: 'Delete user'
      description: 'Delete a user account'
      operationId: "deleteUser"
      produces:
      - 'application/json'
      security:
      - ApiKeyAuth: []
      parameters:
      - name: 'userId'
        in: 'path'
        description: 'ID of user to delete'
        required: true
        type: 'string'
      responses:
        '200':
          description: 'User deleted successfully'
        '401':
          description: 'Unauthorized'
        '404':
          description: 'User not found'

  /users/paging/{page}:
    get:
      tags:
      - 'users'
      summary: 'Get users with pagination'
      description: 'Retrieve users with pagination and optional keyword search'
      operationId: "getUsersPaging"
      produces:
      - 'application/json'
      parameters:
      - name: 'page'
        in: 'path'
        description: 'Page number for pagination'
        required: true
        type: 'integer'
        minimum: 1
      - name: 'keyword'
        in: 'query'
        description: 'Search keyword for filtering users'
        required: false
        type: 'string'
      responses:
        '200':
          description: 'Users retrieved successfully'
          schema:
            $ref: '#/definitions/PaginatedUsers'

  /profile:
    post:
      tags:
      - 'profile'
      summary: 'Create user profile'
      description: 'Create a detailed profile for the authenticated user'
      operationId: "createProfile"
      consumes:
      - 'application/json'
      produces:
      - 'application/json'
      security:
      - ApiKeyAuth: []
      parameters:
      - in: 'body'
        name: 'body'
        description: 'Profile data'
        required: true
        schema: 
          $ref: '#/definitions/CreateProfileDto'
      responses:
        '201':
          description: 'Profile created successfully'
          schema:
            $ref: '#/definitions/Profile'
        '400':
          description: 'Invalid input'
        '401':
          description: 'Unauthorized'

  /profile/me:
    get:
      tags:
      - 'profile'
      summary: 'Get current user profile'
      description: 'Retrieve the profile of the authenticated user'
      operationId: "getCurrentProfile"
      produces:
      - 'application/json'
      security:
      - ApiKeyAuth: []
      responses:
        '200':
          description: 'Profile retrieved successfully'
          schema:
            $ref: '#/definitions/Profile'
        '401':
          description: 'Unauthorized'
        '404':
          description: 'Profile not found'

  /profile:
    get:
      tags:
      - 'profile'
      summary: 'Get all profiles'
      description: 'Retrieve all user profiles'
      operationId: "getAllProfiles"
      produces:
      - 'application/json'
      responses:
        '200':
          description: 'Profiles retrieved successfully'
          schema:
            type: array
            items:
              $ref: '#/definitions/Profile'

  /profile/user/{userId}:
    get:
      tags:
      - 'profile'
      summary: 'Get profile by user ID'
      description: 'Retrieve a specific user profile by user ID'
      operationId: "getProfileByUserId"
      produces:
      - 'application/json'
      security:
      - ApiKeyAuth: []
      parameters:
      - name: 'userId'
        in: 'path'
        description: 'ID of user whose profile to retrieve'
        required: true
        type: 'string'
      responses:
        '200':
          description: 'Profile retrieved successfully'
          schema:
            $ref: '#/definitions/Profile'
        '401':
          description: 'Unauthorized'
        '404':
          description: 'Profile not found'

  /profile/experience:
    put:
      tags:
      - 'profile'
      summary: 'Add experience to profile'
      description: 'Add work experience to the authenticated user profile'
      operationId: "addExperience"
      consumes:
      - 'application/json'
      produces:
      - 'application/json'
      security:
      - ApiKeyAuth: []
      parameters:
      - in: 'body'
        name: 'body'
        description: 'Experience data'
        required: true
        schema: 
          $ref: '#/definitions/ExperienceDto'
      responses:
        '200':
          description: 'Experience added successfully'
          schema:
            $ref: '#/definitions/Profile'
        '400':
          description: 'Invalid input'
        '401':
          description: 'Unauthorized'

  /profile/experience/{experienceId}:
    delete:
      tags:
      - 'profile'
      summary: 'Delete experience from profile'
      description: 'Remove work experience from the authenticated user profile'
      operationId: "deleteExperience"
      produces:
      - 'application/json'
      security:
      - ApiKeyAuth: []
      parameters:
      - name: 'experienceId'
        in: 'path'
        description: 'ID of experience to delete'
        required: true
        type: 'string'
      responses:
        '200':
          description: 'Experience deleted successfully'
          schema:
            $ref: '#/definitions/Profile'
        '401':
          description: 'Unauthorized'
        '404':
          description: 'Experience not found'

  /profile/education:
    put:
      tags:
      - 'profile'
      summary: 'Add education to profile'
      description: 'Add education information to the authenticated user profile'
      operationId: "addEducation"
      consumes:
      - 'application/json'
      produces:
      - 'application/json'
      security:
      - ApiKeyAuth: []
      parameters:
      - in: 'body'
        name: 'body'
        description: 'Education data'
        required: true
        schema: 
          $ref: '#/definitions/EducationDto'
      responses:
        '200':
          description: 'Education added successfully'
          schema:
            $ref: '#/definitions/Profile'
        '400':
          description: 'Invalid input'
        '401':
          description: 'Unauthorized'

  /profile/education/{educationId}:
    delete:
      tags:
      - 'profile'
      summary: 'Delete education from profile'
      description: 'Remove education information from the authenticated user profile'
      operationId: "deleteEducation"
      produces:
      - 'application/json'
      security:
      - ApiKeyAuth: []
      parameters:
      - name: 'educationId'
        in: 'path'
        description: 'ID of education to delete'
        required: true
        type: 'string'
      responses:
        '200':
          description: 'Education deleted successfully'
          schema:
            $ref: '#/definitions/Profile'
        '401':
          description: 'Unauthorized'
        '404':
          description: 'Education not found'

  /posts:
    post:
      tags:
      - 'posts'
      summary: 'Create new post'
      description: 'Create a new post'
      operationId: "createPost"
      consumes:
      - 'application/json'
      produces:
      - 'application/json'
      security:
      - ApiKeyAuth: []
      parameters:
      - in: 'body'
        name: 'body'
        description: 'Post data'
        required: true
        schema: 
          $ref: '#/definitions/CreatePostDto'
      responses:
        '201':
          description: 'Post created successfully'
          schema:
            $ref: '#/definitions/Post'
        '400':
          description: 'Invalid input'
        '401':
          description: 'Unauthorized'
    get:
      tags:
      - 'posts'
      summary: 'Get all posts'
      description: 'Retrieve all posts'
      operationId: "getAllPosts"
      produces:
      - 'application/json'
      responses:
        '200':
          description: 'Posts retrieved successfully'
          schema:
            type: array
            items:
              $ref: '#/definitions/Post'
    put:
      tags:
      - 'posts'
      summary: 'Update post'
      description: 'Update an existing post'
      operationId: "updatePost"
      consumes:
      - 'application/json'
      produces:
      - 'application/json'
      security:
      - ApiKeyAuth: []
      parameters:
      - name: 'id'
        in: 'query'
        description: 'ID of post to update'
        required: true
        type: 'string'
      - in: 'body'
        name: 'body'
        description: 'Updated post data'
        required: true
        schema: 
          $ref: '#/definitions/UpdatePostDto'
      responses:
        '200':
          description: 'Post updated successfully'
          schema:
            $ref: '#/definitions/Post'
        '400':
          description: 'Invalid input'
        '401':
          description: 'Unauthorized'
        '404':
          description: 'Post not found'

  /posts/{postId}:
    get:
      tags:
      - 'posts'
      summary: 'Get post by ID'
      description: 'Retrieve a specific post by ID'
      operationId: "getPostById"
      produces:
      - 'application/json'
      security:
      - ApiKeyAuth: []
      parameters:
      - name: 'postId'
        in: 'path'
        description: 'ID of post to retrieve'
        required: true
        type: 'string'
      responses:
        '200':
          description: 'Post retrieved successfully'
          schema:
            $ref: '#/definitions/Post'
        '401':
          description: 'Unauthorized'
        '404':
          description: 'Post not found'
    delete:
      tags:
      - 'posts'
      summary: 'Delete post'
      description: 'Delete a post'
      operationId: "deletePost"
      produces:
      - 'application/json'
      security:
      - ApiKeyAuth: []
      parameters:
      - name: 'postId'
        in: 'path'
        description: 'ID of post to delete'
        required: true
        type: 'string'
      responses:
        '200':
          description: 'Post deleted successfully'
        '401':
          description: 'Unauthorized'
        '404':
          description: 'Post not found'

  /posts/paging/{page}:
    get:
      tags:
      - 'posts'
      summary: 'Get posts with pagination'
      description: 'Retrieve posts with pagination'
      operationId: "getPostsPaging"
      produces:
      - 'application/json'
      parameters:
      - name: 'page'
        in: 'path'
        description: 'Page number for pagination'
        required: true
        type: 'integer'
        minimum: 1
      responses:
        '200':
          description: 'Posts retrieved successfully'
          schema:
            $ref: '#/definitions/PaginatedPosts'

  /posts/like/{postId}:
    post:
      tags:
      - 'posts'
      summary: 'Like a post'
      description: 'Add a like to a post'
      operationId: "likePost"
      produces:
      - 'application/json'
      security:
      - ApiKeyAuth: []
      parameters:
      - name: 'postId'
        in: 'path'
        description: 'ID of post to like'
        required: true
        type: 'string'
      responses:
        '200':
          description: 'Post liked successfully'
          schema:
            $ref: '#/definitions/Post'
        '401':
          description: 'Unauthorized'
        '404':
          description: 'Post not found'

  /posts/unlike/{postId}:
    put:
      tags:
      - 'posts'
      summary: 'Unlike a post'
      description: 'Remove a like from a post'
      operationId: "unlikePost"
      produces:
      - 'application/json'
      security:
      - ApiKeyAuth: []
      parameters:
      - name: 'postId'
        in: 'path'
        description: 'ID of post to unlike'
        required: true
        type: 'string'
      responses:
        '200':
          description: 'Post unliked successfully'
          schema:
            $ref: '#/definitions/Post'
        '401':
          description: 'Unauthorized'
        '404':
          description: 'Post not found'

  /posts/comments/{postId}:
    post:
      tags:
      - 'posts'
      summary: 'Add comment to post'
      description: 'Add a comment to a post'
      operationId: "addComment"
      consumes:
      - 'application/json'
      produces:
      - 'application/json'
      security:
      - ApiKeyAuth: []
      parameters:
      - name: 'postId'
        in: 'path'
        description: 'ID of post to comment on'
        required: true
        type: 'string'
      - in: 'body'
        name: 'body'
        description: 'Comment data'
        required: true
        schema: 
          $ref: '#/definitions/CommentDto'
      responses:
        '201':
          description: 'Comment added successfully'
          schema:
            $ref: '#/definitions/Post'
        '400':
          description: 'Invalid input'
        '401':
          description: 'Unauthorized'
        '404':
          description: 'Post not found'

  /posts/comments/{postId}/{commentId}:
    delete:
      tags:
      - 'posts'
      summary: 'Remove comment from post'
      description: 'Remove a comment from a post'
      operationId: "removeComment"
      produces:
      - 'application/json'
      security:
      - ApiKeyAuth: []
      parameters:
      - name: 'postId'
        in: 'path'
        description: 'ID of post'
        required: true
        type: 'string'
      - name: 'commentId'
        in: 'path'
        description: 'ID of comment to remove'
        required: true
        type: 'string'
      responses:
        '200':
          description: 'Comment removed successfully'
          schema:
            $ref: '#/definitions/Post'
        '401':
          description: 'Unauthorized'
        '404':
          description: 'Post or comment not found'

  /posts/share/{postId}:
    post:
      tags:
      - 'posts'
      summary: 'Share a post'
      description: 'Share a post'
      operationId: "sharePost"
      produces:
      - 'application/json'
      security:
      - ApiKeyAuth: []
      parameters:
      - name: 'postId'
        in: 'path'
        description: 'ID of post to share'
        required: true
        type: 'string'
      responses:
        '200':
          description: 'Post shared successfully'
          schema:
            $ref: '#/definitions/Post'
        '401':
          description: 'Unauthorized'
        '404':
          description: 'Post not found'
    delete:
      tags:
      - 'posts'
      summary: 'Unshare a post'
      description: 'Remove share from a post'
      operationId: "unsharePost"
      produces:
      - 'application/json'
      security:
      - ApiKeyAuth: []
      parameters:
      - name: 'postId'
        in: 'path'
        description: 'ID of post to unshare'
        required: true
        type: 'string'
      responses:
        '200':
          description: 'Post unshared successfully'
          schema:
            $ref: '#/definitions/Post'
        '401':
          description: 'Unauthorized'
        '404':
          description: 'Post not found'
  /profile/follow/{userId}:
    put:
      tags:
        - profile
      summary: Follow a user
      description: Follow another user by their ID
      parameters:
        - name: userId
          in: path
          required: true
          type: string
          description: ID of the user to follow
        - name: x-auth-token
          in: header
          required: true
          type: string
          description: Authentication token
      responses:
        200:
          description: Successfully followed user
        401:
          description: Unauthorized
        404:
          description: User not found
    delete:
      tags:
        - profile
      summary: Unfollow a user
      description: Unfollow a user by their ID
      parameters:
        - name: userId
          in: path
          required: true
          type: string
          description: ID of the user to unfollow
        - name: x-auth-token
          in: header
          required: true
          type: string
          description: Authentication token
      responses:
        200:
          description: Successfully unfollowed user
        401:
          description: Unauthorized
        404:
          description: User not found

  /profile/request/{userId}:
    put:
      tags:
        - profile
      summary: Send friend request
      description: Send a friend request to another user
      parameters:
        - name: userId
          in: path
          required: true
          type: string
          description: ID of the user to send friend request to
        - name: x-auth-token
          in: header
          required: true
          type: string
          description: Authentication token
      responses:
        200:
          description: Friend request sent successfully
        401:
          description: Unauthorized
        404:
          description: User not found
    delete:
      tags:
        - profile
      summary: Cancel friend request
      description: Cancel a pending friend request
      parameters:
        - name: userId
          in: path
          required: true
          type: string
          description: ID of the user to cancel friend request
        - name: x-auth-token
          in: header
          required: true
          type: string
          description: Authentication token
      responses:
        200:
          description: Friend request cancelled successfully
        401:
          description: Unauthorized
        404:
          description: Friend request not found

  /profile/friend/{userId}:
    put:
      tags:
        - profile
      summary: Accept friend request
      description: Accept a friend request from another user
      parameters:
        - name: userId
          in: path
          required: true
          type: string
          description: ID of the user whose friend request to accept
        - name: x-auth-token
          in: header
          required: true
          type: string
          description: Authentication token
      responses:
        200:
          description: Friend request accepted successfully
        401:
          description: Unauthorized
        404:
          description: Friend request not found
    delete:
      tags:
        - profile
      summary: Unfriend user
      description: Remove a user from friends list
      parameters:
        - name: userId
          in: path
          required: true
          type: string
          description: ID of the user to unfriend
        - name: x-auth-token
          in: header
          required: true
          type: string
          description: Authentication token
      responses:
        200:
          description: Successfully unfriended user
        401:
          description: Unauthorized
        404:
          description: Friend not found

# Group APIs
  /groups:
    post:
      tags:
        - groups
      summary: Create a new group
      description: Create a new group with name, code and description
      parameters:
        - name: x-auth-token
          in: header
          required: true
          type: string
          description: Authentication token
        - name: body
          in: body
          required: true
          schema:
            $ref: '#/definitions/CreateGroupRequest'
      responses:
        201:
          description: Group created successfully
          schema:
            $ref: '#/definitions/Group'
        400:
          description: Invalid input
        401:
          description: Unauthorized
    get:
      tags:
        - groups
      summary: Get all groups
      description: Retrieve all groups
      parameters:
        - name: x-auth-token
          in: header
          required: true
          type: string
          description: Authentication token
      responses:
        200:
          description: Successfully retrieved groups
          schema:
            type: array
            items:
              $ref: '#/definitions/Group'
        401:
          description: Unauthorized

  /groups/{groupId}:
    put:
      tags:
        - groups
      summary: Update group
      description: Update group information
      parameters:
        - name: groupId
          in: path
          required: true
          type: string
          description: ID of the group to update
        - name: x-auth-token
          in: header
          required: true
          type: string
          description: Authentication token
        - name: body
          in: body
          required: true
          schema:
            $ref: '#/definitions/UpdateGroupRequest'
      responses:
        200:
          description: Group updated successfully
          schema:
            $ref: '#/definitions/Group'
        400:
          description: Invalid input
        401:
          description: Unauthorized
        404:
          description: Group not found
    delete:
      tags:
        - groups
      summary: Delete group
      description: Delete a group
      parameters:
        - name: groupId
          in: path
          required: true
          type: string
          description: ID of the group to delete
        - name: x-auth-token
          in: header
          required: true
          type: string
          description: Authentication token
      responses:
        200:
          description: Group deleted successfully
        401:
          description: Unauthorized
        404:
          description: Group not found

  /groups/join/{groupId}:
    post:
      tags:
        - groups
      summary: Request to join group
      description: Send a request to join a group
      parameters:
        - name: groupId
          in: path
          required: true
          type: string
          description: ID of the group to join
        - name: x-auth-token
          in: header
          required: true
          type: string
          description: Authentication token
      responses:
        200:
          description: Join request sent successfully
        401:
          description: Unauthorized
        404:
          description: Group not found

  /groups/join/{groupId}/{userId}:
    put:
      tags:
        - groups
      summary: Accept join request
      description: Accept a user's request to join the group
      parameters:
        - name: groupId
          in: path
          required: true
          type: string
          description: ID of the group
        - name: userId
          in: path
          required: true
          type: string
          description: ID of the user to accept
        - name: x-auth-token
          in: header
          required: true
          type: string
          description: Authentication token
      responses:
        200:
          description: Join request accepted successfully
        401:
          description: Unauthorized
        404:
          description: Group or user not found

  /groups/manager/{groupId}:
    put:
      tags:
        - groups
      summary: Add manager to group
      description: Add a manager/admin to the group
      parameters:
        - name: groupId
          in: path
          required: true
          type: string
          description: ID of the group
        - name: x-auth-token
          in: header
          required: true
          type: string
          description: Authentication token
        - name: body
          in: body
          required: true
          schema:
            $ref: '#/definitions/AddManagerRequest'
      responses:
        200:
          description: Manager added successfully
        401:
          description: Unauthorized
        404:
          description: Group not found

  /groups/manager/{groupId}/{userId}:
    delete:
      tags:
        - groups
      summary: Remove manager from group
      description: Remove a manager/admin from the group
      parameters:
        - name: groupId
          in: path
          required: true
          type: string
          description: ID of the group
        - name: userId
          in: path
          required: true
          type: string
          description: ID of the manager to remove
        - name: x-auth-token
          in: header
          required: true
          type: string
          description: Authentication token
      responses:
        200:
          description: Manager removed successfully
        401:
          description: Unauthorized
        404:
          description: Group or manager not found

  /groups/members/{groupId}:
    get:
      tags:
        - groups
      summary: Get group members
      description: Get all members of a group
      parameters:
        - name: groupId
          in: path
          required: true
          type: string
          description: ID of the group
        - name: x-auth-token
          in: header
          required: true
          type: string
          description: Authentication token
      responses:
        200:
          description: Successfully retrieved group members
          schema:
            type: array
            items:
              $ref: '#/definitions/GroupMember'
        401:
          description: Unauthorized
        404:
          description: Group not found

  /groups/member/{groupId}:
    delete:
      tags:
        - groups
      summary: Leave group
      description: Leave a group or remove a member
      parameters:
        - name: groupId
          in: path
          required: true
          type: string
          description: ID of the group
        - name: x-auth-token
          in: header
          required: true
          type: string
          description: Authentication token
      responses:
        200:
          description: Successfully left group
        401:
          description: Unauthorized
        404:
          description: Group not found

# Conversation APIs
  /conversation:
    post:
      tags:
        - conversations
      summary: Send message
      description: Send a message in a conversation
      parameters:
        - name: x-auth-token
          in: header
          required: true
          type: string
          description: Authentication token
        - name: body
          in: body
          required: true
          schema:
            $ref: '#/definitions/SendMessageRequest'
      responses:
        201:
          description: Message sent successfully
          schema:
            $ref: '#/definitions/Message'
        400:
          description: Invalid input
        401:
          description: Unauthorized
    get:
      tags:
        - conversations
      summary: Get my conversations
      description: Retrieve all conversations for the current user
      parameters:
        - name: x-auth-token
          in: header
          required: true
          type: string
          description: Authentication token
      responses:
        200:
          description: Successfully retrieved conversations
          schema:
            type: array
            items:
              $ref: '#/definitions/Conversation'
        401:
          description: Unauthorized

# Refresh Token API
  /auth/refresh-token:
    post:
      tags:
        - refresh_token
      summary: Refresh access token
      description: Get a new access token using refresh token
      parameters:
        - name: body
          in: body
          required: true
          schema:
            $ref: '#/definitions/RefreshTokenRequest'
      responses:
        200:
          description: Token refreshed successfully
          schema:
            $ref: '#/definitions/RefreshTokenResponse'
        400:
          description: Invalid refresh token
        401:
          description: Refresh token expired

