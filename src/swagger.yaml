    properties:
      _id:
        type: string
        description: Conversation ID
        example: "685af281ede4f84fc3d5349b"
      participants:
        type: array
        items:
          type: string
        description: IDs of conversation participants
        example: ["6851bb959876243a0c307879", "680cec98301c304286e796f0"]
      lastMessage:
        $ref: '#/definitions/Message'
      createdAt:
        type: string
        format: date-time
        description: Conversation creation timestamp
      updatedAt:
        type: string
        format: date-time
        description: Last activity timestamp

  RefreshTokenRequest:
    type: object
    required:
      - refreshToken
    properties:
      refreshToken:
        type: string
        description: Refresh token to exchange for new access token
        example: "1ba2b8ca4e6dfb9add1b22a6d0d75641827ca51c0205c31b56d4ea67a54a25336e918a4b4973fa59"

  RefreshTokenResponse:
    type: object
    properties:
      accessToken:
        type: string
        description: New access token
        example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
      refreshToken:
        type: string
        description: New refresh token (optional)
        example: "2ca3c9db5f7efb0bee2c33b7e1e86752938cb62d1316d42c67e5fb78b65b36447f029b5c5a84gb6a"
      expiresIn:
        type: integer
        description: Token expiration time in seconds
        example: 3600