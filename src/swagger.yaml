        type: string
        description: Description of the group
        example: "A group about team building activities"

  Group:
    type: object
    properties:
      _id:
        type: string
        description: Group ID
        example: "685a6d7868df09fc8025f665"
      name:
        type: string
        description: Name of the group
        example: "Event"
      code:
        type: string
        description: Unique code for the group
        example: "ccc"
      description:
        type: string
        description: Description of the group
        example: "A group about celebrate parties, award events and other interesting events"
      creator:
        type: string
        description: ID of the group creator
        example: "680cec98301c304286e796f0"
      members:
        type: array
        items:
          $ref: '#/definitions/GroupMember'
      managers:
        type: array
        items:
          $ref: '#/definitions/GroupManager'
      createdAt:
        type: string
        format: date-time
        description: Creation timestamp
      updatedAt:
        type: string
        format: date-time
        description: Last update timestamp

  GroupMember:
    type: object
    properties:
      userId:
        type: string
        description: User ID
        example: "680cd185301c304286e796ec"
      joinedAt:
        type: string
        format: date-time
        description: Date when user joined the group
      status:
        type: string
        enum: [active, pending, banned]
        description: Member status in the group

  GroupManager:
    type: object
    properties:
      userId:
        type: string
        description: Manager user ID
        example: "680cd185301c304286e796ec"
      role:
        type: string
        enum: [admin, moderator]
        description: Manager role in the group
        example: "admin"
      assignedAt:
        type: string
        format: date-time
        description: Date when user was assigned as manager

  AddManagerRequest:
    type: object
    required:
      - userId
      - role
    properties:
      userId:
        type: string
        description: ID of the user to make manager
        example: "680cd185301c304286e796ec"
      role:
        type: string
        enum: [admin, moderator]
        description: Role to assign
        example: "admin"

  SendMessageRequest:
    type: object
    required:
      - to
      - text
    properties:
      conversationId:
        type: string
        description: ID of existing conversation (optional for new conversations)
        example: "685af281ede4f84fc3d5349b"
      to:
        type: string
        description: ID of the recipient user
        example: "6851bb959876243a0c307879"
      text:
        type: string
        description: Message content
        example: "Hello, how are you?"

  Message:
    type: object
    properties:
      _id:
        type: string
        description: Message ID
        example: "685af910c4e2fb6a4f944ae5"
      conversationId:
        type: string
        description: ID of the conversation
        example: "685af281ede4f84fc3d5349b"
      from:
        type: string
        description: ID of the sender
        example: "6851bb959876243a0c307879"
      to:
        type: string
        description: ID of the recipient
        example: "680cec98301c304286e796f0"
      text:
        type: string
        description: Message content
        example: "Hello, how are you?"
      createdAt:
        type: string
        format: date-time
        description: Message timestamp
      readAt:
        type: string
        format: date-time
        description: When message was read (optional)

